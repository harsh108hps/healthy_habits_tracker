<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Healthy Fitness Tracker - Login</title>
  <link rel="stylesheet" href="../css part/login.css">
  
</head>
<body>

  <header>
    <h1>Healthy Fitness Tracker</h1>
    <h2>Welcome to Login Page</h2>
  </header>

  <form id="login-form">
    <h3>Login</h3>

    <label for="login-email">Email:</label><br>
    <input type="email" id="login-email" required><br><br>

    <label for="login-password">Password:</label><br>
    <input type="password" id="login-password" required><br><br>

    <button type="submit">Login</button>

    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
  </form>

  <!-- Firebase scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-ud3Nx2K4LkC4NELxLqRDQRfz0cRO3nA",
      authDomain: "login-form-4cfe0.firebaseapp.com",
      projectId: "login-form-4cfe0",
      storageBucket: "login-form-4cfe0.appspot.com",
      messagingSenderId: "13942909257",
      appId: "1:13942909257:web:d5e015b2fa8bdf1cbb9298",
      measurementId: "G-8RDLS5JJSR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "../index.html";
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    });
  </script>

</body>
</html>
