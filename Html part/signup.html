<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../css part/signup.css">
</head>
<body>
  <h2>Sign Up</h2>
  <form id="signup-form">
    <label>First Name:</label><br>
    <input type="text" id="firstName" required><br><br>

    <label>Last Name:</label><br>
    <input type="text" id="lastName" required><br><br>

    <label>Email:</label><br>
    <input type="email" id="signup-email" required><br><br>

    <label>Password:</label><br>
    <input type="password" id="signup-password" required><br><br>

    <button type="submit">Sign Up</button>
  </form>

  <p>Already have an account? <a href="login.html">Login here</a></p>

  <!-- Firebase scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-ud3Nx2K4LkC4NELxLqRDQRfz0cRO3nA",
      authDomain: "login-form-4cfe0.firebaseapp.com",
      projectId: "login-form-4cfe0",
      storageBucket: "login-form-4cfe0.appspot.com",
      messagingSenderId: "13942909257",
      appId: "1:13942909257:web:d5e015b2fa8bdf1cbb9298",
      measurementId: "G-8RDLS5JJSR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          firstName,
          lastName,
          email
        });

        alert("Signup successful!");
        window.location.href = "login.html";
      } catch (error) {
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
