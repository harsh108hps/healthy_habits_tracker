<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Analytics Dashboard</title>
  <link rel="stylesheet" href="../css part/analytics.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Habit Analytics Dashboard</h1>
    <nav>
      <a href="dashboard.html" class="btn">Back to Dashboard</a>
    </nav>
  </header>

  <section id="analytics-summary">
    <h2>Your Habit Analytics</h2>
    <div id="habit-summary">
      <p>Total Habits: <span id="totalHabits">--</span></p>
      <p>Completion Rate: <span id="completionRate">--%</span></p>
      <p>Best Performing Habit: <span id="bestHabit">--</span></p>
      <p>Worst Performing Habit: <span id="worstHabit">--</span></p>
    </div>
  </section>

  <section id="habit-chart">
    <h2>Habit Completion Trends</h2>
    <canvas id="habitChart" width="400" height="200"></canvas>
  </section>

  <script src="../js part/analytics.js"></script>
</body>
</html>
