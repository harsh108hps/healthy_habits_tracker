<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - HealthyHabits Tracker</title>
  <link rel="stylesheet" href="../css part/dashboard.css">
</head>
<body>
  <header class="dashboard-header">
    <h1>HealthyHabits Tracker</h1>
    <button id="logout-btn">Logout</button>
    <button id="toggleDarkMode">🌓 Toggle Dark Mode</button>

  </header>

  <div class="wellness-section">
    <h3>Your Wellness Score</h3>
    <div id="score-display">78</div>
    <p><a href="../Html part/wellness-score.html" class="view-link">View Detailed Wellness Score</a></p>
  </div>
  
  

  <section class="habit-section">
    <div class="habit-header">
      <h2>Your Habits</h2>
      <a href="habitcreation.html" class="add-habit-btn">+ Add Habit</a>
    </div>
    <div id="habit-list" class="habit-list">
      <!-- Habit cards will be dynamically inserted here -->
    </div>
  </section>
  <section id="analytics-link">
    <p>Want to see your habit progress and trends?</p>
    <a href="analytics.html" class="btn">Go to Habit Analytics</a>
  </section>
  <section id="challenges-link">
    <p>Take on new wellness challenges with friends!</p>
    <a href="challenges.html" class="btn">View Habit Challenges</a>
  </section>
  


  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <!-- Scripts -->
  <script src="../js part/firebase-config.js"></script>
  <script src="../js part/auth.js"></script>
  <script src="../js part/dashboard.js"></script>
</body>
</html>
