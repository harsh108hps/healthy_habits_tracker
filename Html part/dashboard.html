<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthyHabits Tracker - Dashboard</title>
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="../css part/styles.css" />
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">HealthyHabits Tracker</div>
            <div class="nav-actions">
                <a href="habitcreation.html" class="add-habit-btn">➕ Add New Habit</a>
                <button id="logout-btn">Logout</button>
            </div>
        </nav>
    </header>

    <!-- Main Dashboard Content -->
    <main class="dashboard-container">

        <!-- Wellness Score -->
        <section class="wellness-score-section">
            <h2>Your Wellness Score</h2>
            <div id="wellness-score" class="score">0</div>
        </section>

        <!-- Habits List -->
        <section class="habits-section">
            <h2>Your Habits</h2>
            <div id="habit-list" class="habit-list">
                <!-- Habit cards will be injected here by dashboard.js -->
            </div>
        </section>

        <!-- Analytics Chart -->
        <section class="analytics-section">
            <h2>Weekly Trend</h2>
            <canvas id="habit-chart"></canvas>
        </section>
        <a href="Html part/habitcard.html">
            <button>Habit Card</button>
        </a>

    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- Firebase config & initialization -->
    <script src="../js/firebase-config.js"></script>

    <!-- App Logic -->
    <script src="../js/auth.js"></script>
    <script src="../js/habits.js"></script>
    <script src="../js/dashboard.js"></script>

</body>
</html>
